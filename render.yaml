services:
  - type: web
    name: ares-digital-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: ./backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application --workers 2 --timeout 120 --bind 0.0.0.0:$PORT"
    healthCheckPath: /api/db-check/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: "core.settings"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: ""
      - key: ALLOWED_HOSTS
        value: "ares-digital-backend.onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://entregable-machine-learning.vercel.app,http://localhost:5173,http://127.0.0.1:5173"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://ares-digital-backend.onrender.com,https://entregable-machine-learning.vercel.app"
